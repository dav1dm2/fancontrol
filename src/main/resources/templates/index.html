<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de ventiladores</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #17212b; background: #f3f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; }
        main { width: min(1100px, 100%); margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 auto 24px; width: min(1100px, 100%); }
        h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
        h2 { margin: 0 0 16px; font-size: 1.2rem; }
        p { line-height: 1.5; }
        .subtitle, .muted { color: #5b6873; }
        .panel, .device { background: #fff; border: 1px solid #dce3e8; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px #17212b0a; }
        .panel { margin-bottom: 20px; }
        .auth-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
        .field { display: grid; gap: 6px; margin-bottom: 14px; }
        input { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #aab6bf; border-radius: 7px; font: inherit; }
        input:focus, button:focus-visible { outline: 3px solid #89baf2; outline-offset: 2px; }
        button { min-height: 40px; border: 0; border-radius: 7px; padding: 9px 14px; background: #175cd3; color: white; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #1249a8; }
        button.secondary { background: #e8edf2; color: #17212b; }
        button.secondary:hover { background: #dce3e8; }
        button.danger { background: #b42318; }
        button.danger:hover { background: #912018; }
        .header-actions, .device-actions, .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .toolbar { justify-content: space-between; margin-bottom: 14px; }
        #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
        .device h3 { margin: 0 0 12px; overflow-wrap: anywhere; }
        .device p { margin: 8px 0; overflow-wrap: anywhere; }
        .device-actions { margin-top: 14px; }
        .device-actions button { flex: 1 1 auto; }
        .status { font-weight: 700; }
        #users { list-style: none; padding: 0; margin: 0; }
        #users li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e5e9ed; }
        #users li:last-child { border-bottom: 0; }
        #message { min-height: 1.5em; margin: 0 0 12px; }
        .error { color: #b42318; }
        .success { color: #137333; }
        [hidden] { display: none !important; }
        @media (max-width: 520px) {
            body { padding: 14px; }
            header { align-items: flex-start; }
            .panel, .device { padding: 16px; }
            .header-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
<header>
    <div>
        <h1>Controle de ventiladores</h1>
        <p class="subtitle">Monitoramento centralizado dos dispositivos</p>
    </div>
    <div id="accountBar" class="header-actions" hidden>
        <span id="accountLabel"></span>
        <button id="logoutButton" class="secondary" type="button">Sair</button>
    </div>
</header>

<main>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="authPanel" class="auth-grid" aria-label="Acesso ao sistema">
        <form id="loginForm" class="panel">
            <h2>Entrar</h2>
            <label class="field">Nome
                <input name="name" autocomplete="username" required maxlength="100">
            </label>
            <label class="field">Senha
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="panel">
            <h2>Criar conta</h2>
            <p class="muted">O cadastro cria uma conta comum, com acesso somente para consulta.</p>
            <label class="field">Nome
                <input name="name" autocomplete="username" required maxlength="100">
            </label>
            <label class="field">Senha (mínimo de 8 caracteres)
                <input name="password" type="password" autocomplete="new-password" minlength="8" required>
            </label>
            <button type="submit" class="secondary">Cadastrar</button>
        </form>
    </section>

    <section id="appPanel" hidden>
        <section id="adminDevicePanel" class="panel" hidden>
            <h2>Adicionar dispositivo</h2>
            <form id="addDeviceForm" class="header-actions">
                <label class="field" style="flex:1; min-width: min(100%, 220px); margin:0">
                    <span class="muted">Nome do dispositivo</span>
                    <input name="name" required maxlength="255" placeholder="Ex.: ventilador-sala">
                </label>
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2 style="margin:0">Dispositivos</h2>
                <button id="refreshButton" class="secondary" type="button">Atualizar lista</button>
            </div>
            <div id="devices" aria-live="polite"><p>Carregando...</p></div>
        </section>

        <section id="adminUsersPanel" class="panel" hidden>
            <div class="toolbar">
                <div>
                    <h2 style="margin:0 0 4px">Usuários</h2>
                    <p class="muted" style="margin:0">A lista mostra somente os nomes das contas.</p>
                </div>
                <button id="refreshUsersButton" class="secondary" type="button">Atualizar lista</button>
            </div>
            <ul id="users"></ul>
        </section>
    </section>
</main>

<script>
    const tokenStorageKey = "fancontrol.accessToken";
    let accessToken = localStorage.getItem(tokenStorageKey);
    let currentUser = null;

    async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (accessToken) headers.set("Authorization", `Bearer ${accessToken}`);
        if (options.body && !headers.has("Content-Type")) headers.set("Content-Type", "application/json");

        const response = await fetch(path, { ...options, headers });
        if (!response.ok) {
            const error = await readApiError(response);
            if (response.status === 401 && accessToken) {
                clearSession();
                showMessage("Sua sessão terminou. Entre novamente.", true);
            }
            throw new Error(error);
        }
        if (response.status === 204) return null;
        return response.json();
    }

    async function readApiError(response) {
        try {
            const body = await response.json();
            return body.message || "Não foi possível concluir a solicitação.";
        } catch {
            return "Não foi possível concluir a solicitação.";
        }
    }

    function showMessage(message, isError = false) {
        const element = document.getElementById("message");
        element.textContent = message;
        element.className = isError ? "error" : "success";
    }

    function showSignedOut() {
        document.getElementById("authPanel").hidden = false;
        document.getElementById("appPanel").hidden = true;
        document.getElementById("accountBar").hidden = true;
    }

    function showSignedIn(user) {
        currentUser = user;
        const isAdmin = user.role === "ADMIN";
        document.getElementById("authPanel").hidden = true;
        document.getElementById("appPanel").hidden = false;
        document.getElementById("accountBar").hidden = false;
        document.getElementById("accountLabel").textContent = `${user.name} · ${isAdmin ? "Administrador" : "Usuário"}`;
        document.getElementById("adminDevicePanel").hidden = !isAdmin;
        document.getElementById("adminUsersPanel").hidden = !isAdmin;
        showMessage("");
        loadDevices();
        if (isAdmin) loadUsers();
    }

    function clearSession() {
        accessToken = null;
        currentUser = null;
        localStorage.removeItem(tokenStorageKey);
        showSignedOut();
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
        event.preventDefault();
        const formElement = event.currentTarget;
        const form = new FormData(formElement);
        try {
            const result = await api("/api/auth/login", {
                method: "POST",
                body: JSON.stringify({ name: form.get("name"), password: form.get("password") })
            });
            accessToken = result.accessToken;
            localStorage.setItem(tokenStorageKey, accessToken);
            formElement.reset();
            showSignedIn(result.user);
        } catch (error) {
            showSignedOut();
            showMessage(error.message, true);
        }
    });

    document.getElementById("registerForm").addEventListener("submit", async event => {
        event.preventDefault();
        const formElement = event.currentTarget;
        const form = new FormData(formElement);
        try {
            const user = await api("/api/auth/register", {
                method: "POST",
                body: JSON.stringify({ name: form.get("name"), password: form.get("password") })
            });
            formElement.reset();
            document.querySelector('#loginForm input[name="name"]').value = user.name;
            showMessage("Conta criada. Entre com seu nome e senha.");
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
        clearSession();
        showMessage("Você saiu do sistema.");
    });

    document.getElementById("refreshButton").addEventListener("click", loadDevices);
    document.getElementById("refreshUsersButton").addEventListener("click", loadUsers);

    document.getElementById("addDeviceForm").addEventListener("submit", async event => {
        event.preventDefault();
        const formElement = event.currentTarget;
        const form = new FormData(formElement);
        try {
            await api("/api/devices", {
                method: "POST",
                body: JSON.stringify({ name: form.get("name") })
            });
            formElement.reset();
            showMessage("Dispositivo adicionado.");
            await loadDevices();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    document.getElementById("devices").addEventListener("click", async event => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const id = button.dataset.id;
        const action = button.dataset.action;
        try {
            if (action === "rename") {
                const card = button.closest(".device");
                const name = card.querySelector("input[name='newName']").value.trim();
                await api(`/api/devices/${id}`, { method: "PUT", body: JSON.stringify({ name }) });
                showMessage("Nome do dispositivo atualizado.");
            } else if (action === "delete") {
                if (!confirm("Remover este dispositivo?")) return;
                await api(`/api/devices/${id}`, { method: "DELETE" });
                showMessage("Dispositivo removido.");
            } else if (action === "on" || action === "off") {
                await api(`/api/devices/${id}/fan/${action}`, { method: "POST" });
                showMessage("Comando enviado.");
            }
            await loadDevices();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    document.getElementById("users").addEventListener("click", async event => {
        const button = event.target.closest("button[data-user-id]");
        if (!button) return;
        const id = Number(button.dataset.userId);
        const userName = button.dataset.userName;
        if (!confirm(`Remover a conta de ${userName}?`)) return;
        try {
            await api(`/api/users/${id}`, { method: "DELETE" });
            if (currentUser && currentUser.id === id) {
                clearSession();
                showMessage("Sua conta foi removida.");
                return;
            }
            showMessage("Usuário removido.");
            await loadUsers();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    async function loadDevices() {
        try {
            const devices = await api("/api/devices");
            const container = document.getElementById("devices");
            if (devices.length === 0) {
                container.innerHTML = '<p class="muted">Nenhum dispositivo cadastrado.</p>';
                return;
            }
            const isAdmin = currentUser && currentUser.role === "ADMIN";
            container.innerHTML = devices.map(device => `
                <article class="device" data-device-id="${device.id}">
                    <h3>${escapeHtml(device.name)}</h3>
                    <p><strong>ID:</strong> ${device.id}</p>
                    <p><strong>Status:</strong> <span class="status">${escapeHtml(device.status)}</span></p>
                    <p><strong>Ventilador:</strong> ${device.fanState ? "Ligado" : "Desligado"}</p>
                    <p><strong>Último sensor:</strong> ${escapeHtml(device.lastSensorActivation ?? "Nunca")}</p>
                    <p><strong>Última comunicação:</strong> ${escapeHtml(device.lastSeen ?? "Nunca")}</p>
                    ${isAdmin ? `
                        <label class="field">Nome do dispositivo
                            <input name="newName" value="${escapeHtml(device.name)}" maxlength="255" aria-label="Novo nome de ${escapeHtml(device.name)}">
                        </label>
                        <div class="device-actions">
                            <button data-action="rename" data-id="${device.id}" type="button">Salvar nome</button>
                            <button data-action="on" data-id="${device.id}" type="button">Ligar</button>
                            <button data-action="off" data-id="${device.id}" type="button" class="secondary">Desligar</button>
                            <button data-action="delete" data-id="${device.id}" type="button" class="danger">Remover</button>
                        </div>
                    ` : ""}
                </article>
            `).join("");
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    async function loadUsers() {
        try {
            const users = await api("/api/users");
            const list = document.getElementById("users");
            if (users.length === 0) {
                list.innerHTML = '<li class="muted">Nenhum usuário cadastrado.</li>';
                return;
            }
            list.innerHTML = users.map(user => `
                <li>
                    <span>${escapeHtml(user.name)}</span>
                    <button type="button" class="danger" data-user-id="${user.id}" data-user-name="${escapeHtml(user.name)}">Remover</button>
                </li>
            `).join("");
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
    }

    async function restoreSession() {
        if (!accessToken) {
            showSignedOut();
            return;
        }
        try {
            const user = await api("/api/auth/me");
            showSignedIn(user);
        } catch {
            clearSession();
        }
    }

    restoreSession();
</script>
</body>
</html>
